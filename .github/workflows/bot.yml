name: Telegram Price Bot

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */4 * * *' # روشن شدن خودکار هر ۴ ساعت (بدون قطعی در صبح)

# قفل هوشمند: جلوگیری از روشن شدن ۲ ربات همزمان (خاموش کردن خودکار قبلی)
concurrency:
  group: telegram-price-bot
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Bot
      env:
        BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      run: |
        timeout 350m python main.py || true
