name: Telegram Price Bot

on:
  workflow_dispatch: # امکان روشن کردن دستی
  schedule:
    - cron: '0 */6 * * *' # روشن شدن خودکار هر ۶ ساعت برای آنلاین ماندن ۲۴ ساعته

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 355 # اجرا به مدت نزدیک به ۶ ساعت
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Bot
      env:
        BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      run: |
        timeout 350m python main.py || true
